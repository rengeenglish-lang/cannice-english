<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdeedb"/>
    </linearGradient>
    <linearGradient id="rayR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="rayL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="tower"><path d="M26.5 27 L37.5 27 L41 55 L23 55 Z"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0b6b3a"/>
  <!-- beams -->
  <path d="M37 17.5 L60 10 L60 27 L37 21.5 Z" fill="url(#rayR)"/>
  <path d="M27 17.5 L4 10 L4 27 L27 21.5 Z" fill="url(#rayL)"/>
  <!-- dome + lantern -->
  <circle cx="32" cy="7.2" r="1.6" fill="url(#g)"/>
  <path d="M25.5 14.5 Q32 5.5 38.5 14.5 Z" fill="url(#g)"/>
  <rect x="26.5" y="14.5" width="11" height="8.5" rx="1" fill="url(#g)"/>
  <rect x="29" y="16.5" width="6" height="4.5" rx="0.6" fill="#a7f0c2"/>
  <rect x="24" y="23" width="16" height="3" rx="1" fill="url(#g)"/>
  <!-- tower with diagonal stripes -->
  <g clip-path="url(#tower)">
    <rect x="20" y="26" width="24" height="30" fill="url(#g)"/>
    <path d="M20 36 L44 30 L44 34.5 L20 40.5 Z M20 46 L44 40 L44 44.5 L20 50.5 Z" fill="#0b6b3a"/>
  </g>
  <!-- door + base -->
  <path d="M30 55 L30 50.5 Q32 48.5 34 50.5 L34 55 Z" fill="#0b6b3a"/>
  <rect x="17" y="55" width="30" height="3.2" rx="1.2" fill="url(#g)"/>
</svg>
