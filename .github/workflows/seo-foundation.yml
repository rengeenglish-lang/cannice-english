name: SEO foundation verification
on:
  pull_request:
    paths:
      - 'app/(dashboard)/admin/seo/**'
      - 'app/blog/**'
      - 'app/actions/admin-seo*.ts'
      - 'components/admin/seo/**'
      - 'components/admin/AdminShell.tsx'
      - 'lib/seo/**'
      - 'server/seo/**'
      - 'server/services/seo/**'
      - 'server/services/admin-blog.service.ts'
      - 'tests/seo-*'
      - 'scripts/verify-seo-local.ts'
      - 'scripts/verify-seo-browser.ts'
      - 'prisma/**'
      - '.github/workflows/seo-foundation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: seo_foundation_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/seo_foundation_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:test-only@localhost:5432/seo_foundation_test
      AUTH_SECRET: isolated-test-secret-not-used-for-production-123456
      AUTH_URL: https://localhost.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint -- --quiet
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: node --conditions=react-server --import tsx --test --test-concurrency=1 tests/seo-foundation.test.ts tests/seo-foundation-database.test.ts tests/seo-keywords.test.ts tests/seo-studio.test.ts tests/seo-intelligence.test.ts tests/seo-planning.test.ts tests/seo-publishing.test.ts tests/seo-performance.test.ts tests/seo-nav.test.ts tests/seo-conversions.test.ts
      - run: npm run build
      - name: Verify rendered SEO pages and real credentials authorization
        env:
          AUTH_URL: https://localhost:3190
          AUTH_TRUST_HOST: 'true'
        run: |
          node node_modules/next/dist/bin/next start --port 3190 > /tmp/seo-server.log 2>&1 &
          seo_server_pid=$!
          trap 'kill "$seo_server_pid"' EXIT
          node --input-type=module -e 'for(let n=0;n<30;n++){try{const r=await fetch("http://localhost:3190/api/auth/csrf");if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,1000));}process.exit(1);'
          node --conditions=react-server --import tsx scripts/verify-seo-local.ts
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile admin interactions
        env:
          AUTH_URL: https://localhost:3191
          AUTH_TRUST_HOST: 'true'
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/seo-local-key.pem -out /tmp/seo-local-cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' >/dev/null 2>&1
          node node_modules/next/dist/bin/next start --port 3190 > /tmp/seo-browser-server.log 2>&1 &
          seo_server_pid=$!
          trap 'kill "$seo_server_pid"' EXIT
          node --input-type=module -e 'for(let n=0;n<30;n++){try{const r=await fetch("http://localhost:3190/api/auth/csrf");if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,1000));}process.exit(1);'
          node --conditions=react-server --import tsx scripts/verify-seo-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-browser-verification
          path: /tmp/seo-browser-artifacts
