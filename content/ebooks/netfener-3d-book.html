<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelimenin İzini Sür · 3D</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Figtree:wght@400;600;700&display=swap"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F1E6}</style></head><body><!-- Netfener 3D kitap: fare üzerindeyken döner, fare çekilince durur -->
<style>
.nf-stage{--w:min(300px,64vw);--h:calc(var(--w)*1.4142);--t:calc(var(--w)*0.12);
  position:relative;width:var(--w);height:var(--h);margin:0 auto;perspective:1700px;cursor:grab;touch-action:pan-y;
  -webkit-tap-highlight-color:transparent;outline:none}
.nf-stage:focus-visible{box-shadow:0 0 0 3px rgba(212,162,43,.6);border-radius:6px}
.nf-book{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.nf-face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.nf-front,.nf-back{inset:0;background-size:cover;background-position:center;border-radius:2px 5px 5px 2px}
.nf-front{transform:translateZ(calc(var(--t)/2))}
.nf-front::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(90deg,rgba(0,0,0,.28) 0,rgba(255,255,255,.10) 1.4%,rgba(0,0,0,.05) 3%,transparent 7%,transparent 88%,rgba(255,255,255,.06) 100%)}
.nf-back{transform:rotateY(180deg) translateZ(calc(var(--t)/2))}
.nf-spine{width:var(--t);height:var(--h);left:calc((var(--w) - var(--t))/2);
  transform:rotateY(-90deg) translateZ(calc(var(--w)/2));
  background:linear-gradient(90deg,#0c1829,#13243A 30%,#182c46 55%,#13243A 80%,#0c1829);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10% 0 7%;
  border-top:3px solid #D4A22B;border-bottom:3px solid #D4A22B;box-sizing:border-box}
.nf-spine .nf-sp-t{writing-mode:vertical-rl;font:700 calc(var(--t)*.36)/1 "Cinzel",Georgia,serif;letter-spacing:.12em;color:#F4EFE4;white-space:nowrap}
.nf-spine .nf-sp-t b{color:#E3B546;font-weight:700}
.nf-spine .nf-sp-s{writing-mode:vertical-rl;font:600 calc(var(--t)*.2)/1 "Figtree",system-ui,sans-serif;letter-spacing:.2em;color:#9FB0C2;white-space:nowrap}
.nf-spine svg{width:calc(var(--t)*.62);height:auto}
.nf-edge{width:var(--t);height:calc(var(--h) - 6px);top:3px;left:calc((var(--w) - var(--t))/2);
  transform:rotateY(90deg) translateZ(calc(var(--w)/2 - 3px));
  background:repeating-linear-gradient(90deg,#f3eee3 0 1px,#e2dccd 1px 2px),#efe9dc;
  box-shadow:inset 0 0 12px rgba(0,0,0,.18)}
.nf-top,.nf-bottom{width:calc(var(--w) - 5px);height:var(--t);top:calc((var(--h) - var(--t))/2);left:0;
  background:repeating-linear-gradient(0deg,#f3eee3 0 1px,#e2dccd 1px 2px),#efe9dc}
.nf-top{transform:rotateX(90deg) translateZ(calc(var(--h)/2 - 3px))}
.nf-bottom{transform:rotateX(-90deg) translateZ(calc(var(--h)/2 - 3px))}
.nf-shadow{position:absolute;left:50%;bottom:calc(var(--h)*-0.1);width:calc(var(--w)*1.05);height:calc(var(--w)*.14);
  transform:translateX(-50%);background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);filter:blur(4px);pointer-events:none}
</style>

<div class="nf-stage" tabindex="0" role="img" aria-label="Kelimenin İzini Sür · YDS &amp; YÖKDİL · Cilt 1 — 3B kitap görünümü">
  <div class="nf-shadow"></div>
  <div class="nf-book">
    <div class="nf-face nf-front" style="background-image:url('kelimenin-izini-sur-front.jpg')"></div>
    <div class="nf-face nf-back" style="background-image:url('kelimenin-izini-sur-back.jpg')"></div>
    <div class="nf-face nf-spine">
      <svg viewBox="0 0 60 60" aria-hidden="true"><g stroke="#E3B546" stroke-width="2" stroke-linecap="round"><line x1="20" y1="18" x2="3" y2="11"/><line x1="20" y1="21" x2="1" y2="21"/><line x1="20" y1="24" x2="3" y2="31"/><line x1="40" y1="18" x2="57" y2="11"/><line x1="40" y1="21" x2="59" y2="21"/><line x1="40" y1="24" x2="57" y2="31"/></g><path d="M23 15 Q30 6 37 15 Z" fill="#F4EFE4"/><rect x="24.5" y="15" width="11" height="9.5" fill="none" stroke="#F4EFE4" stroke-width="1.5"/><rect x="27" y="16.5" width="6" height="6.5" fill="#E3B546"/><rect x="22" y="24.5" width="16" height="2.6" fill="#F4EFE4"/><path d="M25 27.1 L35 27.1 L38 55 L22 55 Z" fill="#F4EFE4"/><path d="M28 55 L28 48.5 Q30 46.5 32 48.5 L32 55 Z" fill="#13243A"/><rect x="19" y="55" width="22" height="2.6" fill="#F4EFE4"/></svg>
      <div class="nf-sp-t">KELİMENİN <b>İZİNİ SÜR</b></div>
      <div class="nf-sp-s">YDS &amp; YÖKDİL · CİLT 1</div>
      <div class="nf-sp-s" style="color:#E3B546">NETFENER</div>
    </div>
    <div class="nf-face nf-edge"></div>
    <div class="nf-face nf-top"></div>
    <div class="nf-face nf-bottom"></div>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.nf-stage').forEach(function(stage){
    var book = stage.querySelector('.nf-book'), shadow = stage.querySelector('.nf-shadow');
    var angle = -28, spinning = false, last = 0, SPEED = 42; // degrees per second
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function draw(){
      book.style.transform = 'rotateX(4deg) rotateY(' + angle + 'deg)';
      var c = Math.abs(Math.cos(angle * Math.PI / 180));
      shadow.style.width = 'calc(var(--w) * ' + (0.55 + 0.5 * c).toFixed(3) + ')';
    }
    function tick(ts){
      if (!spinning) return;
      if (last) angle -= SPEED * (ts - last) / 1000;
      last = ts; draw(); requestAnimationFrame(tick);
    }
    function start(){ if (spinning || reduce) return; spinning = true; last = 0; requestAnimationFrame(tick); }
    function stop(){ spinning = false; }
    stage.addEventListener('mouseenter', start);
    stage.addEventListener('mouseleave', stop);
    stage.addEventListener('focus', start);
    stage.addEventListener('blur', stop);
    stage.addEventListener('touchstart', function(){ spinning ? stop() : start(); }, {passive:true});
    if (reduce) { stage.addEventListener('click', function(){ angle -= 45; draw(); }); }
    draw();
  });
})();
</script>

</body></html>
